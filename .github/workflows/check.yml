# Per-application CI gate, generated by SR-Infra scripts/new-app.mjs.
#
# Deliberately small. The whole point of extraction is that a change to one domain
# runs that domain's checks and nothing else — SR-Main's ci.yml is 856 lines because
# it gates the whole site. Do not grow this file towards it: if a check here is not
# about THIS application, it belongs in SR-Main or SR-Infra.
#
name: Local Plan Navigator

on:
  # Not master: release.yml runs this same gate before it ships, so a push there
  # would otherwise start two runs in one concurrency group and cancel one of
  # them, which reads like a failure.
  push:
    branches-ignore: [master]
  pull_request:
  # A workflow invoked with `uses:` must declare workflow_call, or the caller
  # fails as a workflow-file error — which GitHub reports without naming the file
  # it could not resolve.
  workflow_call:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - run: npm ci

      # The vendored gateway and identity files are copies of the audited SR-Infra
      # originals. Drift is a security problem, not a style one, so it fails here
      # rather than being noticed during an incident.
      - name: Verify the vendored gateway matches its pinned SR-Infra version
        run: node scripts/verify-kit.mjs

      - run: npm run check
      - run: npm run build
      - run: npm test

      # An extracted application must build without SR-Main on disk. If this step
      # ever needs a path outside the repo, the extraction is not finished.
      - name: Prove the build is self-contained
        run: node scripts/verify-self-contained.mjs
