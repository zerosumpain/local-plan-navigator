# Per-application production release, generated by SR-Infra scripts/new-app.mjs.
#
# This is the piece the Policy Analysis rollout never had: its first production
# deployment used a manually transferred image, and the handover records
# "automated production CI and a production candidate slot remain follow-up work".
#
# The flow is candidate-first and reversible at every step:
#   build image -> start the INACTIVE slot -> health check it -> switch routing ->
#   verify the public URL serves the new release id -> keep the old slot running.
# Routing is a file the gateway reads per request, so rollback is a rename, not a
# rebuild. The previous slot stays up so already-open pages keep their assets.
#
name: Release Local Plan Navigator

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release-local-plan-navigator
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  release:
    needs: check
    # The ref guard sits on BOTH arms on purpose. SR-Main learned this the hard
    # way: with the guard only on the push arm, `gh workflow run` against any
    # branch deployed that branch to production.
    # RELEASE_ENABLED gates the deploy on the runner actually existing. Without
    # it this job queues forever against a self-hosted label nothing answers, and
    # the run shows as failed or cancelled — so a green gate reads as a red
    # repository and nobody can tell a real failure from a missing runner.
    # Set the variable once the runner is registered:
    #   gh variable set RELEASE_ENABLED --body true --repo <owner>/<repo>
    if: >-
      !cancelled() &&
      needs.check.result == 'success' &&
      vars.RELEASE_ENABLED == 'true' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, sr-local-plan-navigator]
    timeout-minutes: 25
    env:
      APP: local-plan-navigator
      CONFIG_DIR: /etc/sr-local-plan-navigator
      RELEASE_DIR: /opt/sr-local-plan-navigator
      # Set the PROBE_URL repository variable once the ingress routes this app.
      PROBE_URL: ${{ vars.PROBE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Choose the release id and the inactive slot
        id: plan
        run: |
          set -euo pipefail
          RELEASE="$(git rev-parse --short=12 HEAD)"
          ACTIVE="$(jq -r .active "$CONFIG_DIR/routing/routing.json")"
          if [ "$ACTIVE" = "primary" ]; then TARGET=candidate; else TARGET=primary; fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"
          echo "Releasing $RELEASE into the $TARGET slot (currently serving $ACTIVE)"

      # An immutable tag per release. Never reuse a tag: a future worker restart
      # would silently pick up a different image than the one that was verified.
      - name: Build the immutable image
        run: |
          set -euo pipefail
          docker build --build-arg RELEASE_ID=${{ steps.plan.outputs.release }} \
            -t sr-${APP}:${{ steps.plan.outputs.release }} .

      - name: Stage the release directory
        run: |
          set -euo pipefail
          DEST="$RELEASE_DIR/releases/${{ steps.plan.outputs.release }}"
          sudo mkdir -p "$DEST"
          sudo cp deploy/compose.yaml deploy/app.json "$DEST/"

      # --no-deps so an ordinary web release leaves the worker, the gateway, the
      # database and the rest of the site completely alone.
      - name: Start the inactive web slot
        run: |
          set -euo pipefail
          DEST="$RELEASE_DIR/releases/${{ steps.plan.outputs.release }}"
          APP_WEB_IMAGE=sr-${APP}:${{ steps.plan.outputs.release }} \
          docker compose --env-file "$CONFIG_DIR/images.env" -f "$DEST/compose.yaml" \
            --profile ${{ steps.plan.outputs.target }} \
            up -d --no-deps --wait web-${{ steps.plan.outputs.target }}

      # PROBE_URL proves the PUBLIC path serves the release that was just started.
      # It is empty until the edge actually routes this app: probing a URL the
      # ingress still sends to Main compares Main's release header against this
      # app's, fails, and rolls back a switch that was fine. The slot's own
      # /__alive check still gates the switch either way.
      - name: Switch traffic and verify, rolling back if it cannot be proven
        run: |
          set -euo pipefail
          if [ -n "${PROBE_URL:-}" ]; then
            node scripts/release.mjs deploy/app.json ${{ steps.plan.outputs.target }} --probe "$PROBE_URL"
          else
            echo "::notice::No PROBE_URL set — this app is not routed publicly yet, so the switch is verified against the slot only."
            node scripts/release.mjs deploy/app.json ${{ steps.plan.outputs.target }}
          fi

      # Only now is the new image the one a future restart will choose.
      - name: Pin the verified image for restarts
        run: |
          set -euo pipefail
          sudo sed -i "s|^APP_WEB_IMAGE=.*|APP_WEB_IMAGE=sr-${APP}:${{ steps.plan.outputs.release }}|" \
            "$CONFIG_DIR/images.env"

      - name: Report
        run: |
          echo "::notice::${APP} ${{ steps.plan.outputs.release }} live in the ${{ steps.plan.outputs.target }} slot; ${{ steps.plan.outputs.active }} retained for rollback"
