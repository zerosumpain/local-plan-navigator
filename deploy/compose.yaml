# Production compose for an extracted application, generated by SR-Infra
# scripts/new-app.mjs.
#
# Two web slots and the navigator's own front. The front decides which slot
# serves traffic by reading routing.json per request, so switching a release never
# restarts the front and never drops a connection.
#
# Deliberate choices carried over from the proven policy stack:
#   - network_mode: host, because everything binds loopback and cloudflared is the
#     only thing exposed to the internet.
#   - env_file with format: raw, because the production .env contains values that a
#     shell-style parser would mangle.
#   - a SEPARATE image variable per role, so rebuilding web cannot silently change
#     which image a future worker restart picks up.
#   - profiles on the candidate slot, so an ordinary `up` never starts both.
#   - liveness on /__alive rather than /health, because /health is a real public
#     page owned by the health domain and the convention would shadow it.
name: sr-local-plan-navigator

x-app-base: &app-base
  network_mode: host
  restart: unless-stopped
  env_file:
    - path: /etc/sr-local-plan-navigator/app.env
      format: raw
  mem_limit: 1g
  cpus: 1.5
  security_opt: ['no-new-privileges:true']
  # Both slots share the admin page's saved model connections and the usage
  # log, so a release or a switch of slot keeps them.
  volumes:
    - state:/var/lib/local-plan-navigator

volumes:
  state: {}

services:
  gateway:
    # The navigator's own front (server/front.mjs), from its own image — not the
    # estate's shared gateway. It routes to the active slot and asks no other
    # service who a visitor is: the web process decides that itself, so the
    # navigator does not depend on the rest of the site being up. It holds no
    # secrets, so it gets no env file. The release workflow never touches it;
    # after changing server/front.mjs, pin APP_GATEWAY_IMAGE to a newer image of
    # this app and recreate it (docs/handover.md).
    image: ${APP_GATEWAY_IMAGE:?Set the immutable front image}
    network_mode: host
    command: ['node', 'server/front.mjs']
    restart: unless-stopped
    environment:
      FRONT_PORT: '5370'
      SLOT_PRIMARY: '5372'
      SLOT_CANDIDATE: '5373'
      CANONICAL_HOST: strangeramblings.com
      ROUTING_FILE: /etc/sr-local-plan-navigator/routing/routing.json
    volumes:
      # The DIRECTORY, not the file. release.mjs writes routing.json atomically
      # (temp file + rename) so the front can never read a half-written one —
      # and a rename replaces the inode. A single-file bind mount follows the
      # ORIGINAL inode, so the container would keep reading the content frozen at
      # the moment it started and never see a switch.
      - /etc/sr-local-plan-navigator/routing:/etc/sr-local-plan-navigator/routing:ro
    read_only: true
    mem_limit: 128m
    cpus: 0.5
    security_opt: ['no-new-privileges:true']

  web-primary:
    <<: *app-base
    image: ${APP_WEB_IMAGE:?Set the immutable web image}
    environment:
      HOST: 127.0.0.1
      PORT: '5372'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:5372/__alive').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
  web-candidate:
    <<: *app-base
    image: ${APP_CANDIDATE_IMAGE:-${APP_WEB_IMAGE}}
    profiles: ['candidate']
    environment:
      HOST: 127.0.0.1
      PORT: '5373'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:5373/__alive').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
